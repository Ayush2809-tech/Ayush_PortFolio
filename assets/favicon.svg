<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#080b14"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#grad)" opacity="0.15" stroke="url(#grad)" stroke-width="2"/>
  <text x="32" y="41" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="24" font-weight="900" fill="url(#grad)" text-anchor="middle" filter="url(#glow)">&lt;AS/&gt;</text>
</svg>
